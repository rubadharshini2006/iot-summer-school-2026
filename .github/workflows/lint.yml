name: Count INO Files

on:
  push:

jobs:
  count-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Count .ino files
        run: |
          python -c "import os; count=0
          for root, dirs, files in os.walk('.'):
              count += sum(1 for f in files if f.endswith('.ino'))
          print('Total .ino files:', count)"
